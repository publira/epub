name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [stable, oldstable]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        if: matrix.go-version == 'stable'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

      - name: Run tests (oldstable)
        if: matrix.go-version == 'oldstable'
        run: go test ./...

      - name: Run tests with coverage
        if: matrix.go-version == 'stable'
        run: go test -coverprofile=coverage.out -coverpkg=github.com/publira/epub ./...

      - name: Show coverage summary
        if: matrix.go-version == 'stable'
        run: go tool cover -func=coverage.out

      - name: Set up Java for EPUBCheck
        if: matrix.go-version == 'stable'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.4.1'

      - name: Generate test EPUB
        if: matrix.go-version == 'stable'
        run: |
          mkdir -p testdata/epubcheck-input
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > testdata/epubcheck-input/page.png
          go run ./cmd/epub build-images -out testdata/out.epub -title "EPUBCheck test" -direction ltr testdata/epubcheck-input/page.png

      - name: Verify with EPUBCheck
        if: matrix.go-version == 'stable'
        run: ./scripts/run-epubcheck.sh testdata/out.epub

      - name: Upload coverage artifact
        if: matrix.go-version == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage.out
          path: coverage.out
